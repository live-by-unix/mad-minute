<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mad Minute</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#07080c;--card:rgba(17,19,27,.84);--text:#f6f7fb;--muted:#858a9b;--border:#292d3a;--button:#151821;--accent:#fff}
:root.light{color-scheme:light;--bg:#f3f4f7;--card:rgba(255,255,255,.88);--text:#101116;--muted:#686d7b;--border:#d9dce4;--button:#eef0f5;--accent:#101116}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .25s,color .25s}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 30%,#30385c55 0,transparent 32%),radial-gradient(circle at 5% 90%,#6874c622 0,transparent 28%);z-index:-1}
.app{width:min(920px,94vw);text-align:center}
.logo{font-size:clamp(2rem,5vw,3.5rem);font-weight:950;letter-spacing:-.07em;margin:0}
.tag{color:var(--muted);margin:6px 0 30px;font-size:.95rem}
.theme{position:fixed;right:22px;top:20px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:800;backdrop-filter:blur(12px)}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:34px;box-shadow:0 25px 80px #0005;backdrop-filter:blur(18px)}
h2{font-size:2rem;margin:0 0 10px;letter-spacing:-.04em}
.sub{color:var(--muted);margin:0 0 28px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 auto 24px}
.mode,.secondary{border:1px solid var(--border);background:var(--button);color:var(--text);padding:16px 10px;border-radius:15px;cursor:pointer;font-weight:800;transition:.15s}
.mode:hover,.mode.selected{border-color:#8b91ff;background:#777dff1c;transform:translateY(-2px)}
.mode small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.start{border:0;background:var(--accent);color:var(--bg);border-radius:16px;padding:17px 42px;font-weight:950;font-size:1.1rem;cursor:pointer;transition:.15s}
.start:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0003}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:950;letter-spacing:-.06em}
.timer.danger{color:#ff536e}
.progress{height:7px;background:#80859533;border-radius:99px;overflow:hidden;flex:1}.progress span{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.stats{display:flex;gap:20px;color:var(--muted);font-size:.85rem;font-weight:750;white-space:nowrap}.stats b{color:var(--text)}
.number{font-size:clamp(5rem,17vw,10rem);font-weight:1000;letter-spacing:-.09em;line-height:1;margin:30px 0 38px;font-variant-numeric:tabular-nums}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.answer{border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:18px;padding:22px;font-size:1.2rem;font-weight:900;cursor:pointer;transition:.12s}.answer:hover{transform:translateY(-2px)}
.feedback{height:32px;color:var(--muted);font-weight:800;margin-top:16px}.correct{color:#36bf78}.wrong{color:#ff536e}
.resultScore{font-size:5rem;font-weight:1000;letter-spacing:-.08em;margin:4px 0}
.resultGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}
.resultBox{background:var(--button);border:1px solid var(--border);border-radius:16px;padding:18px 8px}.resultBox b{display:block;font-size:1.6rem}.resultBox span{color:var(--muted);font-size:.78rem}
.resultActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.secondary{padding:14px 22px}
kbd{border:1px solid var(--border);background:var(--button);border-radius:6px;padding:2px 7px;color:var(--muted)}
@media(max-width:650px){.card{padding:22px}.modes{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.progress{order:3;flex-basis:100%}.stats{width:100%;justify-content:center}.resultGrid{grid-template-columns:1fr 1fr}.number{margin:24px 0 30px}}
</style>
</head>
<body>
<button id="theme" class="theme" aria-label="Toggle dark/light mode">☀️ Light</button>
<main class="app">
<h1 class="logo">MAD MINUTE</h1>
<p class="tag">60 seconds. No mercy.</p>

<section id="home" class="screen active"><div class="card">
<h2>How many can you get?</h2>
<p class="sub">Decide whether each randomly generated number is prime or composite.</p>
<div class="modes">
<button class="mode selected" data-max="50">Easy<small>2–50</small></button>
<button class="mode" data-max="500">Normal<small>2–500</small></button>
<button class="mode" data-max="10000">Hard<small>2–10,000</small></button>
<button class="mode" data-max="1000000">Insane<small>2–1,000,000</small></button>
</div>
<button id="start" class="start">START MAD MINUTE</button>
<p class="tag" style="margin:20px 0 0">Press <kbd>P</kbd> for Prime or <kbd>C</kbd> for Composite</p>
</div></section>

<section id="game" class="screen"><div class="card">
<div class="top"><div id="timer" class="timer">1:00.0</div><div class="progress"><span id="bar"></span></div><div class="stats"><span>Solved <b id="solved">0</b></span><span>Streak <b id="streak">0</b></span></div></div>
<div id="number" class="number">37</div>
<div class="answers"><button class="answer" data-answer="prime">PRIME <small>(P)</small></button><button class="answer" data-answer="composite">COMPOSITE <small>(C)</small></button></div>
<div id="feedback" class="feedback"></div>
</div></section>

<section id="results" class="screen"><div class="card">
<p class="tag" style="margin:0">TIME!</p><div id="resultScore" class="resultScore">0</div><p class="sub" style="margin-bottom:0">numbers solved</p>
<div class="resultGrid"><div class="resultBox"><b id="correct">0</b><span>CORRECT</span></div><div class="resultBox"><b id="wrong">0</b><span>WRONG</span></div><div class="resultBox"><b id="accuracy">0%</b><span>ACCURACY</span></div><div class="resultBox"><b id="best">0</b><span>BEST STREAK</span></div></div>
<div class="resultActions"><button id="again" class="start">PLAY AGAIN</button><button id="change" class="secondary">CHANGE DIFFICULTY</button></div>
</div></section>
</main>

<script>
(()=> {
const $=id=>document.getElementById(id); const screens=document.querySelectorAll(".screen"), modes=document.querySelectorAll(".mode");
let max=50,current=0,solved=0,correct=0,wrong=0,streak=0,best=0,startedAt=0,raf=0,accepting=false,audio=null;
function show(id){screens.forEach(s=>s.classList.toggle("active",s.id===id))}
function isPrime(n){if(n<2)return false;if(n===2)return true;if(n%2===0)return false;for(let d=3;d*d<=n;d+=2)if(n%d===0)return false;return true}
function randomNumber(){return Math.floor(Math.random()*(max-1))+2}
function next(){current=randomNumber();$("number").textContent=current.toLocaleString();$("feedback").textContent="";accepting=true}
function musicStart(){
try{
audio=new (window.AudioContext||window.webkitAudioContext)(); const ctx=audio;
const master=ctx.createGain(); master.gain.value=.055; master.connect(ctx.destination);
const notes=[261.63,329.63,392,493.88,392,329.63,293.66,349.23];
let i=0;
function beat(){if(!audio)return;const now=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.75,now+.025);g.gain.exponentialRampToValueAtTime(.001,now+.24);o.connect(g);g.connect(master);o.start(now);o.stop(now+.25)}
beat(); audio._timer=setInterval(beat,260);
}catch(e){}
}
function musicStop(){if(audio){clearInterval(audio._timer);audio.close();audio=null}}
function tick(){const remaining=Math.max(0,60000-(performance.now()-startedAt));const s=remaining/1000;$("timer").textContent=`0:${s.toFixed(1).padStart(4,"0")}`;$("bar").style.transform=`scaleX(${remaining/60000})`;$("timer").classList.toggle("danger",remaining<=10000);if(remaining<=0){finish();return}raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);musicStop();solved=correct=wrong=streak=best=0;$("solved").textContent=$("streak").textContent="0";startedAt=performance.now();show("game");next();musicStart();raf=requestAnimationFrame(tick)}
function answer(type){if(!accepting)return;accepting=false;const actual=isPrime(current)?"prime":"composite";solved++;if(type===actual){correct++;streak++;best=Math.max(best,streak);$("feedback").textContent="CORRECT!";$("feedback").className="feedback correct"}else{wrong++;streak=0;$("feedback").textContent=`WRONG — ${actual.toUpperCase()}`;$("feedback").className="feedback wrong"}$("solved").textContent=solved;$("streak").textContent=streak;setTimeout(()=>{if(performance.now()-startedAt<60000)next()},45)}
function finish(){cancelAnimationFrame(raf);musicStop();accepting=false;$("timer").textContent="0:00.0";$("bar").style.transform="scaleX(0)";$("resultScore").textContent=solved;$("correct").textContent=correct;$("wrong").textContent=wrong;$("accuracy").textContent=solved?`${(correct/solved*100).toFixed(1)}%`:"0%";$("best").textContent=best;show("results")}
modes.forEach(b=>b.onclick=()=>{modes.forEach(x=>x.classList.remove("selected"));b.classList.add("selected");max=+b.dataset.max});
document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(b.dataset.answer));$("start").onclick=start;$("again").onclick=start;$("change").onclick=()=>show("home");
document.onkeydown=e=>{if($("game").classList.contains("active")){if(e.key.toLowerCase()==="p")answer("prime");if(e.key.toLowerCase()==="c")answer("composite")}if(e.key==="Enter"&&$("home").classList.contains("active"))start()};
const saved=localStorage.getItem("mad-minute-theme");if(saved==="light")document.documentElement.classList.add("light");
function updateTheme(){const light=document.documentElement.classList.contains("light");$("theme").textContent=light?"🌙 Dark":"☀️ Light";localStorage.setItem("mad-minute-theme",light?"light":"dark")}
$("theme").onclick=()=>{document.documentElement.classList.toggle("light");updateTheme()};updateTheme();
})();
</script>
</body>
</html>
